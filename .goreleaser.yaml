# Release: git tag v0.1.0 && git push --tags  (CI runs goreleaser)
# Check field names against https://goreleaser.com/customization/ for the
# GoReleaser version you install; the Homebrew section has changed recently.
version: 2

project_name: relai

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/relai
    binary: relai
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]

universal_binaries:
  - replace: true # one macOS binary for Apple Silicon + Intel

archives:
  - formats: [tar.gz]
    files: [README.md, LICENSE, THIRD_PARTY_NOTICES.md]

checksum:
  name_template: checksums.txt

# Publishes to github.com/colt005/homebrew-tap so users can
# `brew install colt005/tap/relai`. Create that repo first.
homebrew_casks:
  - name: relai
    repository:
      owner: colt005
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/colt005/relai
    description: Browse, resume, and hand off sessions between CLI coding agents (Claude Code, Codex, Gemini CLI, Cursor, and more)
    license: MIT
    binary: relai
    # The binary isn't notarized yet, so clear the quarantine flag macOS adds to
    # downloaded files; otherwise Gatekeeper blocks it on first run.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/relai"]
          end

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
